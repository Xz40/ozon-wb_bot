#docker-compose.yml

services:
  my_db:
    image: postgres:16
    container_name: ozon_bot
    restart: always
    env_file:
      - .env.docker
    ports:
      - '8080:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ozon_bot"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: app
    container_name: app_backend
    env_file:
      - .env.docker
    ports:
      - '80:80'
    environment:
      DATABASE_URL: ${DB_URL}
    depends_on:
      my_db:
        condition: service_healthy

  parser:
    build: ./parser
    container_name: parser_service
    env_file:
      - .env.docker
    depends_on:
      - my_db





